<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turntable 360°</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root { --panel-w: 360px; --text: #1d1d1f; --muted: #75757a; --line: #ececef; --accent: #b8894d;
    --ok: #2e8b57; --warn: #c98a12; --bad: #c0392b; }

  #panel { position: fixed; top: 0; left: 0; bottom: 0; width: var(--panel-w); z-index: 5; overflow-y: auto;
    background: #faf9f7; border-right: 1px solid var(--line); color: var(--text); padding: 28px 26px; box-sizing: border-box; }
  #panel h1 { font-size: 26px; font-weight: 600; margin: 6px 0 2px; letter-spacing: -.01em; }
  #panel .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; padding: 5px 10px; border-radius: 20px; background: #fff; border: 1px solid var(--line); }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .status.dostepne { color: var(--ok); } .status.rezerwacja { color: var(--warn); } .status.sprzedane { color: var(--bad); }
  .price { font-size: 28px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums; }
  .ppm { color: var(--muted); font-size: 13px; margin: 2px 0 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
  .grid div { background: #fff; padding: 12px 14px; }
  .grid span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .grid b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .rooms { list-style: none; padding: 0; margin: 0 0 24px; }
  .rooms li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .rooms li b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .feat { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 26px; padding: 0; list-style: none; }
  .feat li { font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px; }
  .cta { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
    padding: 13px; border-radius: 10px; font-size: 15px; }
  .cta:hover { filter: brightness(1.07); }
  .contact { text-align: center; font-size: 13px; color: var(--muted); margin-top: 10px; }
  .contact a { color: inherit; }
  #panelToggle { display: none; }

  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: var(--panel-w); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  #stage.dragging { cursor: grabbing; }
  canvas { width: 100%; height: 100%; display: block; }

  #loader { position: absolute; inset: 0; display: grid; place-items: center; background: #fff; z-index: 10;
    transition: opacity .4s; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .bar { width: 220px; height: 3px; background: #e3e3e6; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #b8894d; transition: width .15s; }

  /* Telefon: panel jako wysuwana karta na dole */
  @media (max-width: 760px) {
    #stage { left: 0; bottom: 64px; }
    #panel { top: auto; right: 0; width: auto; max-height: 75vh; border-right: 0; border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.08); padding: 0 20px 24px;
      transform: translateY(calc(100% - 64px)); transition: transform .3s ease; }
    #panel.open { transform: none; }
    #panelToggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; height: 64px;
      border: 0; background: none; padding: 0; font: inherit; color: var(--text); cursor: pointer; position: sticky; top: 0;
      background: #faf9f7; z-index: 1; }
    #panelToggle strong { font-size: 16px; }
    #panelToggle .chev { transition: transform .3s; color: var(--muted); }
    #panel.open .chev { transform: rotate(180deg); }
    #panel h1, #status { display: none; }
    #panelToggle .status { margin-right: auto; }
  }
</style>
</head>
<body>

<aside id="panel">
  <button id="panelToggle" aria-expanded="false">
    <strong id="tName"></strong><span id="tStatus" class="status"></span>
    <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 15l6-6 6 6"/></svg>
  </button>
  <span id="status" class="status"></span>
  <h1 id="name"></h1>
  <p class="sub" id="location"></p>
  <p class="price" id="price"></p>
  <p class="ppm" id="ppm"></p>
  <div class="grid" id="grid"></div>
  <h2>Pomieszczenia</h2>
  <ul class="rooms" id="rooms"></ul>
  <h2>Udogodnienia</h2>
  <ul class="feat" id="features"></ul>
  <a class="cta" id="cta" href="#">Zapytaj o mieszkanie</a>
  <p class="contact" id="contact"></p>
</aside>

<div id="stage"><canvas id="cv"></canvas><div id="loader"><div class="bar"><i id="loadBar"></i></div></div></div>

<script>
// ===================== DANE MIESZKANIA — EDYTUJ TUTAJ =====================
// status: 'dostepne' | 'rezerwacja' | 'sprzedane'
const APARTMENT = {
  name: 'Mieszkanie A.12',
  location: 'Budynek A · ul. Przykładowa 12, Kraków',
  status: 'dostepne',
  price: 749000,            // zł; ustaw null, żeby ukryć cenę
  area: 58.4,               // m²
  rooms: 3,
  floor: '2 / 5',
  exposure: 'Południowy zachód',
  outdoor: 'Taras 14,2 m² + balkon 4,1 m²',
  handover: 'IV kw. 2027',
  roomList: [
    ['Salon z aneksem kuchennym', 26.3],
    ['Sypialnia', 12.1],
    ['Pokój', 9.4],
    ['Łazienka', 4.6],
    ['WC', 1.8],
    ['Przedpokój', 4.2],
  ],
  features: ['Taras', 'Balkon', 'Garderoba', 'Komórka lokatorska', 'Miejsce postojowe (opcja)', 'Winda'],
  contact: { phone: '+48 600 000 000', email: 'sprzedaz@example.com' },
};
// ==========================================================================

(function renderPanel(a) {
  const $ = id => document.getElementById(id);
  const fmt = (v, d = 0) => v.toLocaleString('pl-PL', { minimumFractionDigits: d, maximumFractionDigits: d });
  const statusText = { dostepne: 'Dostępne', rezerwacja: 'Rezerwacja', sprzedane: 'Sprzedane' }[a.status] || a.status;
  for (const el of [$('status'), $('tStatus')]) { el.textContent = statusText; el.classList.add(a.status); }
  $('name').textContent = $('tName').textContent = a.name;
  $('location').textContent = a.location;
  if (a.price && a.status !== 'sprzedane') {
    $('price').textContent = fmt(a.price) + ' zł';
    $('ppm').textContent = fmt(a.price / a.area) + ' zł/m²';
  } else { $('price').remove(); $('ppm').remove(); }
  $('grid').innerHTML = [
    ['Metraż', fmt(a.area, 1) + ' m²'], ['Pokoje', a.rooms], ['Piętro', a.floor], ['Ekspozycja', a.exposure],
    ['Przestrzeń zewn.', a.outdoor], ['Oddanie', a.handover],
  ].map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  $('rooms').innerHTML = a.roomList.map(([k, v]) => `<li>${k}<b>${fmt(v, 1)} m²</b></li>`).join('');
  $('features').innerHTML = a.features.map(f => `<li>${f}</li>`).join('');
  $('cta').href = `mailto:${a.contact.email}?subject=${encodeURIComponent('Zapytanie: ' + a.name)}`;
  if (a.status === 'sprzedane') $('cta').remove();
  $('contact').innerHTML = `<a href="tel:${a.contact.phone.replace(/\s/g, '')}">${a.contact.phone}</a> · <a href="mailto:${a.contact.email}">${a.contact.email}</a>`;
  document.title = a.name + ' — widok 360°';

  const panel = $('panel'), tog = $('panelToggle');
  tog.onclick = () => { const o = panel.classList.toggle('open'); tog.setAttribute('aria-expanded', o); };
})(APARTMENT);

// Sekwencja: Sequence.0001.jpg … Sequence.0045.jpg (co druga klatka)
const SRCS = [];
for (let i = 1; i <= 45; i += 2) SRCS.push(`Sequence.${String(i).padStart(4, '0')}.jpg`);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');

let frames = [];
let pos = 0;              // ciągła pozycja (float) w klatkach
let velocity = 0;         // bezwładność po puszczeniu (klatki / ms)
let zoom = 1, panX = 0, panY = 0;
let dragging = false, dragMode = 'rotate', lastX = 0, lastY = 0, lastT = 0;
let lastDrawn = -1, dirty = true;

const n = () => frames.length;
const idx = () => ((Math.round(pos) % n()) + n()) % n();

// ---------- Ładowanie ----------
let loaded = 0;
Promise.all(SRCS.map(src => new Promise(res => {
  const img = new Image();
  img.onload = img.onerror = () => {
    document.getElementById('loadBar').style.width = (++loaded / SRCS.length * 100) + '%';
    res(img.naturalWidth ? img : null);
  };
  img.src = src;
}))).then(imgs => {
  frames = imgs.filter(Boolean);
  return Promise.all(frames.map(f => f.decode().catch(() => {})));
}).then(() => {
  dirty = true;
  document.getElementById('loader').classList.add('hide');
});

// ---------- Rysowanie ----------
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(stage.clientWidth * dpr);
  cv.height = Math.round(stage.clientHeight * dpr);
  dirty = true;
}
new ResizeObserver(resize).observe(stage);
resize();

function draw() {
  if (!n()) return;
  const i = idx();
  if (i === lastDrawn && !dirty) return;
  lastDrawn = i; dirty = false;
  const img = frames[i];
  const W = cv.width, H = cv.height, dpr = W / stage.clientWidth;
  const s = Math.min(W / img.naturalWidth, H / img.naturalHeight) * zoom;
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, (W - w) / 2 + panX * dpr, (H - h) / 2 + panY * dpr, w, h);
}

let prev = performance.now();
function tick(now) {
  const dt = Math.min(now - prev, 100); prev = now;
  if (!dragging && Math.abs(velocity) > 0.0005) {
    pos += velocity * dt;
    velocity *= Math.pow(0.994, dt);
  } else if (!dragging) velocity = 0;
  draw();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---------- Mysz: LPM = obrót, PPM = przesuwanie, kółko = zoom, dwuklik = reset ----------
// ---------- Dotyk: 1 palec = obrót, 2 palce = zoom + przesuwanie, podwójne stuknięcie = reset ----------
const pxPerFrame = () => Math.max(8, Math.min(30, stage.clientWidth / (n() * 1.5 || 1)));
const touches = new Map();
let pinchDist = 0, pinchX = 0, pinchY = 0, lastTap = 0;

function resetView() { zoom = 1; panX = panY = 0; dirty = true; }

function pinchState() {
  const [a, b] = [...touches.values()];
  return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
}

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  if (e.pointerType === 'touch') {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      dragging = false; velocity = 0;
      ({ d: pinchDist, x: pinchX, y: pinchY } = pinchState());
      return;
    }
    const now = performance.now();
    if (now - lastTap < 300) { resetView(); lastTap = 0; } else lastTap = now;
  }
  if (touches.size > 1) return;
  dragging = true; velocity = 0;
  dragMode = e.button === 2 ? 'pan' : 'rotate';
  lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)) {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size === 2) {
      const p = pinchState();
      if (pinchDist) zoomAt(p.d / pinchDist, p.x, p.y);
      if (zoom > 1) { panX += p.x - pinchX; panY += p.y - pinchY; }
      pinchDist = p.d; pinchX = p.x; pinchY = p.y;
      return;
    }
  }
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  const now = performance.now(), dt = Math.max(now - lastT, 1);
  if (dragMode === 'pan') {
    if (zoom > 1) { panX += dx; panY += dy; dirty = true; }
  } else {
    const df = dx / pxPerFrame();
    pos += df;
    velocity = velocity * 0.6 + (df / dt) * 0.4;
  }
  lastX = e.clientX; lastY = e.clientY; lastT = now;
});
function endPointer(e) {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinchDist = 0;
  if (!dragging) return;
  dragging = false;
  stage.classList.remove('dragging');
  if (performance.now() - lastT > 80) velocity = 0;
  velocity = Math.max(-0.05, Math.min(0.05, velocity));
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('contextmenu', e => e.preventDefault());

function zoomAt(factor, cx, cy) {
  const nz = Math.max(1, Math.min(6, zoom * factor));
  const f = nz / zoom;
  const r = stage.getBoundingClientRect();
  const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
  panX = ox - (ox - panX) * f;
  panY = oy - (oy - panY) * f;
  zoom = nz;
  if (zoom === 1) panX = panY = 0;
  dirty = true;
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
}, { passive: false });
stage.addEventListener('dblclick', resetView);
</script>
</body>
</html>
